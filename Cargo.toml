[package]
name = "cinemosaic"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "One still from the middle of every shot of a cut, laid out on one sheet"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ed25519-dalek = "2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
cfb = "0.10"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
png = "0.18"
rfd = "0.17.2"
roxmltree = "0.21"
serde_json = "1"
slint = { version = "1.19.0", features = ["raw-window-handle-06", "unstable-winit-030"] }
tiff = "0.10"
fontdb = "0.23"
ab_glyph = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
raw-window-handle = "0.6"

[dev-dependencies]
uuid = "1"

[build-dependencies]
slint-build = "1.18.1"

[[bin]]
name = "cinemosaic"
path = "src/main.rs"

[[bin]]
name = "cinemosaic-app"
path = "src/app.rs"
